<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Gestor Total - Diego Gobernador</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f9; line-height: 1.5; color: #333; }
        .section { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #24292e; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #2ea44f; color: white; border: none; padding: 12px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:disabled { background: #94d3a2; }
        textarea { height: 250px; font-family: monospace; }
        label { font-weight: bold; font-size: 0.9em; }
        
        /* Estilos para la lista de borrado */
        .repo-item { display: flex; justify-content: space-between; align-items: center; background: #f6f8fa; padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #e1e4e8; }
        .repo-name-text { font-weight: bold; font-size: 0.9em; color: #0366d6; overflow: hidden; text-overflow: ellipsis; }
        .btn-del { background: #d73a49; width: auto; padding: 6px 12px; font-size: 0.8em; }
        .btn-confirm { background: #b3101c !important; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .hidden { display: none; }
        #status { font-weight: bold; text-align: center; margin-top: 10px; }
        .blue-btn { background: #0366d6; }
    </style>
</head>
<body>

    <h2>Aura Gestor Total</h2>

    <div id="auth-section" class="section">
        <label>Pega tu Token de GitHub:</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
        <button onclick="loadInitialData()">Conectar y Abrir Panel</button>
    </div>

    <div id="create-section" class="section hidden">
        <h3>🚀 Crear Nuevo Repositorio</h3>
        <input type="text" id="new-repo-name" placeholder="Nombre del repositorio">
        <select id="new-repo-vis">
            <option value="false">Público</option>
            <option value="true">Privado</option>
        </select>
        <button onclick="createNewRepo()">Crear Repositorio</button>
    </div>

    <div id="manage-section" class="section hidden">
        <h3>🗑️ Gestionar Repositorios</h3>
        <div id="repo-delete-list"></div>
        <p style="font-size: 0.7em; color: #666; text-align: center;">Pulsa "ELIMINAR" y luego confirma para borrar.</p>
    </div>

    <div id="repo-section" class="section hidden">
        <h3>📝 Editor de Archivos</h3>
        <label>Selecciona para editar:</label>
        <select id="repo-list" onchange="resetEditor()"></select>
        
        <label>Ruta del archivo:</label>
        <input type="text" id="file-path" value="index.html">
        
        <button class="blue-btn" onclick="loadFile()">Cargar Contenido</button>
    </div>

    <div id="editor-section" class="section hidden">
        <label>Contenido del archivo:</label>
        <textarea id="editor" placeholder="Cargando código..."></textarea>
        <button id="save-btn" onclick="saveFile()">Borrar anterior y Guardar Nuevo</button>
        <p id="status"></p>
    </div>

    <script>
        let currentSha = "";

        // CARGA INICIAL DE DATOS
        async function loadInitialData() {
            const token = document.getElementById('token').value.trim();
            if (!token) return alert("Por favor, ingresa un token.");
            await loadRepos();
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('create-section').classList.remove('hidden');
            document.getElementById('manage-section').classList.remove('hidden');
            document.getElementById('repo-section').classList.remove('hidden');
        }

        async function loadRepos() {
            const token = document.getElementById('token').value;
            try {
                const response = await fetch(`https://api.github.com/user/repos?per_page=100&sort=updated&t=${Date.now()}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const repos = await response.json();
                
                // Llenar select del editor
                const select = document.getElementById('repo-list');
                select.innerHTML = repos.map(r => `<option value="${r.full_name}">${r.name}</option>`).join('');
                
                // Llenar lista de borrado
                const deleteList = document.getElementById('repo-delete-list');
                deleteList.innerHTML = repos.map(r => `
                    <div class="repo-item">
                        <span class="repo-name-text">${r.name}</span>
                        <button id="del-${r.id}" class="btn-del" onclick="confirmDelete('${r.full_name}', '${r.id}')">ELIMINAR</button>
                    </div>
                `).join('');

            } catch (e) {
                alert("Error al cargar repositorios.");
            }
        }

        // FUNCIÓN DE BORRADO EN DOS PASOS (LA QUE SÍ FUNCIONA)
        function confirmDelete(fullName, id) {
            const btn = document.getElementById(`del-${id}`);
            if (!btn.classList.contains('btn-confirm')) {
                btn.innerText = "SÍ, BORRAR";
                btn.classList.add('btn-confirm');
                setTimeout(() => {
                    if(btn) {
                        btn.innerText = "ELIMINAR";
                        btn.classList.remove('btn-confirm');
                    }
                }, 4000);
            } else {
                executeDelete(fullName, btn);
            }
        }

        async function executeDelete(fullName, btn) {
            const token = document.getElementById('token').value;
            btn.disabled = true;
            btn.innerText = "BORRANDO...";
            try {
                const res = await fetch(`https://api.github.com/repos/${fullName}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (res.status === 204) {
                    await loadRepos(); // Recargar todo
                } else {
                    alert("No se pudo borrar. Revisa los permisos de tu token.");
                    btn.disabled = false;
                    btn.innerText = "ELIMINAR";
                    btn.classList.remove('btn-confirm');
                }
            } catch (e) { alert("Error de conexión."); }
        }

        // CREAR NUEVO REPO
        async function createNewRepo() {
            const token = document.getElementById('token').value;
            const name = document.getElementById('new-repo-name').value.trim();
            const isPrivate = document.getElementById('new-repo-vis').value === "true";
            if(!name) return alert("Escribe un nombre");

            try {
                const res = await fetch('https://api.github.com/user/repos', {
                    method: 'POST',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, private: isPrivate, auto_init: true })
                });
                if(res.ok) {
                    document.getElementById('new-repo-name').value = "";
                    await loadRepos();
                    alert("¡Creado con éxito!");
                } else { alert("Error al crear. El nombre ya existe."); }
            } catch (e) { alert("Error de red."); }
        }

        // --- TU EDITOR ORIGINAL ---
        async function loadFile() {
            const token = document.getElementById('token').value;
            const repo = document.getElementById('repo-list').value;
            const path = document.getElementById('file-path').value;
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await response.json();
                if (data.content) {
                    document.getElementById('editor').value = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
                    currentSha = data.sha;
                    document.getElementById('editor-section').classList.remove('hidden');
                } else { alert("Archivo no encontrado."); }
            } catch (e) { alert("Error al cargar el archivo."); }
        }

        async function saveFile() {
            const token = document.getElementById('token').value;
            const repo = document.getElementById('repo-list').value;
            const path = document.getElementById('file-path').value;
            const content = document.getElementById('editor').value;
            const btn = document.getElementById('save-btn');
            const status = document.getElementById('status');

            btn.disabled = true;
            status.innerText = "Guardando cambios...";
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Update via Aura Gestor",
                        content: btoa(unescape(encodeURIComponent(content))),
                        sha: currentSha
                    })
                });
                if (response.ok) {
                    const result = await response.json();
                    currentSha = result.content.sha;
                    status.innerText = "✅ ¡Guardado con éxito!";
                } else { status.innerText = "❌ Error al guardar."; }
            } catch (e) { status.innerText = "Error de conexión."; }
            finally { btn.disabled = false; }
        }

        function resetEditor() {
            document.getElementById('editor-section').classList.add('hidden');
            document.getElementById('editor').value = "";
            document.getElementById('status').innerText = "";
        }
    </script>
</body>
</html>
